[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-insights"
version = "0.2.0"
description = "Real-time vehicle tracking and counting system with YOLOv8 and advanced tracking"
readme = "README.md"
requires-python = ">=3.10,<3.16"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Cordova", email = "daencordova@gmail.com" }]
keywords = ["computer-vision", "tracking", "yolo", "traffic", "opencv", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Vision & inference
    "opencv-python>=4.10.0,<5.0.0",
    "numpy>=1.26.0,<2.2.0",
    "scipy>=1.11.0,<1.15.0",
    "scikit-learn>=1.3.0,<1.6.0",
    "scikit-image>=0.22.0,<0.25.0",
    "ultralytics>=8.3.0,<9.0.0",
    # Runtime
    "onnxruntime>=1.18.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "psutil>=5.9.0,<7.0.0",
    "numba>=0.59.0,<0.62.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.3.0,<3.0.0",
    "torchvision>=0.18.0,<1.0.0",
]
dev = [
    "ruff>=0.5.0,<0.8.0",
    "mypy>=1.10.0,<2.0.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "pytest-timeout>=2.3.0",
    "pre-commit>=3.7.0,<5.0.0",
    "types-PyYAML",
]
profiling = [
    "line-profiler>=4.1.0",
    "memory-profiler>=0.61.0",
]

[project.scripts]
traffic-insights = "traffic_insights.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traffic_insights = ["py.typed"]

# ─────────────────────────────────────────────────────────────
# Ruff
# ─────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info", "data"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "D",            # pydocstyle
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "C4",           # comprehensions
    "TID",          # tidy imports
    "TCH",          # type-checking
    "YTT",          # 2020
    "T20",          # no-print
    "FBT",          # boolean trap
    "COM",          # trailing comma
    "T10",          # debugger
    "FIX",          # fixme
    "ISC",          # implicit str concat
    "LOG",          # logging
    "INP",          # no pep420
    "PIE",          # pie
    "PT",           # pytest
    "RSE",          # raise
    "RET",          # return
    "SLF",          # self
    "ARG",          # unused args
    "PL",           # pylint
]
ignore = [
    "D100", "D104", "D107",   # docstrings in packages/__init__
    "E501",                   # handled by formatter
    "N801", "N802",           # allow YOLODetector, ONNXBackend style
    "D102",                   # docstring in private methods
    "ARG002",                 # unused method argument (interfaces)
    "COM812",                 # formatter handles
    "PLR0913",                # too many args (config-heavy constructors)
    "PLR2004",                # magic value comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLR2004", "ARG"]
"src/**/__init__.py" = ["F401", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["traffic_insights"]
combine-as-imports = true
force-sort-within-sections = true

# ─────────────────────────────────────────────────────────────
# Mypy
# ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_unimported = false
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["tests/", "data/", "scripts/"]

[[tool.mypy.overrides]]
module = ["ultralytics.*", "onnxruntime.*", "numba.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=traffic_insights --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
timeout = 60

# ─────────────────────────────────────────────────────────────
# Coverage
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__init__.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]